        // RENDER SESAR WITH FLIP
        L.geoJSON(dataSesar, {
            style: function(feature) {
                var n = feature.properties.nama;
                var c = "red"; 
                if (n === "RMKS") c = "darkred";
                if (n === "JAVA BACK-ARC THRUST") c = "crimson";
                return { color: c, weight: 5, opacity: 0.8 };
            },
            onEachFeature: function(feature, layer) {
                var nama = feature.properties.nama;
                var daftarSesarFlip = ["JAVA BACK-ARC THRUST"]; 
                var perluFlip = daftarSesarFlip.includes(nama);

                layer.setText(nama, {
                    repeat: false, center: true, offset: -12,
                    orientation: perluFlip ? 'flip' : 0,
                    attributes: { 'fill': 'white', 'font-weight': 'bold', 'font-size': '13px', 'style': 'text-shadow: 2px 2px 3px black;' }
                });
            }
        }).addTo(map);

        // FUNGSI ESTIMASI MMI DAN PGA BERDASARKAN JARAK KE SESAR (KILOMETER)
        function hitungPgaMmiByDistance(dKm) {
            var mmiVal = "";
            var pgaVal = "";

            if (dKm <= 2) {
                mmiVal = "VIII - IX (Sangat Kuat / Kerusakan Parah)";
                pgaVal = "> 30 %g";
            } else if (dKm <= 5) {
                mmiVal = "VII - VIII (Sangat Kuat / Kerusakan Sedang)";
                pgaVal = "18 - 30 %g";
            } else if (dKm <= 10) {
                mmiVal = "VI - VII (Kuat / Ringan-Sedang)";
                pgaVal = "9 - 18 %g";
            } else if (dKm <= 20) {
                mmiVal = "V - VI (Sedang / Dirasakan Banyak Orang)";
                pgaVal = "3.9 - 9 %g";
            } else if (dKm <= 40) {
                mmiVal = "III - IV (Ringan)";
                pgaVal = "1.4 - 3.9 %g";
            } else {
                mmiVal = "I - II (Tidak Terasa / Lemah)";
                pgaVal = "< 1.4 %g";
            }

            return { mmi: mmiVal, pga: pgaVal };
        }

        // OBJEK GPS & GARIS PENGHUBUNG
        var userMarker = L.circleMarker([0,0], { radius: 9, color: 'white', weight: 3, fillColor: '#007bff', fillOpacity: 1 }).addTo(map);
        var accuracyCircle = L.circle([0,0], { radius: 1, color: '#007bff', weight: 1, fillOpacity: 0.15 }).addTo(map);
        var distanceLine = L.polyline([], { color: '#007bff', weight: 3, dashArray: '5, 10', opacity: 0.8 }).addTo(map);

        var gpsActive = false;

        function lacakSaya() {
            if (!navigator.geolocation) return alert("GPS tidak didukung.");
            navigator.geolocation.watchPosition((pos) => {
                var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
                
                userMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]).setRadius(acc);

                // HITUNG TITIK TERDEKAT MENGGUNAKAN TURF
                var userPt = turf.point([lng, lat]);
                var snapped = turf.nearestPointOnLine(dataSesar, userPt, { units: 'kilometers' });
                
                var closestLng = snapped.geometry.coordinates[0];
                var closestLat = snapped.geometry.coordinates[1];
                var jarakKm = parseFloat(snapped.properties.dist.toFixed(2));
                var namaSesar = snapped.properties.nama || "Sesar";

                // UPDATE GARIS PENGHUBUNG KE SESAR TERDEKAT
                distanceLine.setLatLngs([
                    [lat, lng],
                    [closestLat, closestLng]
                ]);

                // KALKULASI PGA DAN MMI SECARA REAL-TIME DARI JARAK
                var gempainfo = hitungPgaMmiByDistance(jarakKm);

                document.getElementById('info-panel').innerHTML = `
                    📡 <b>GPS:</b> ${Math.round(acc)} m <br> 
                    📏 <b>Jarak:</b> <span style="color:red">${jarakKm} km ke ${namaSesar}</span><br>
                    ⚠️ <b>Estimasi MMI:</b> ${gempainfo.mmi}<br>
                    ⚠️ <b>PGA:</b> ${gempainfo.pga}
                `;
                
                if (!gpsActive) { map.setView([lat, lng], 13); gpsActive = true; }
            }, (err) => alert("Aktifkan GPS!"), { enableHighAccuracy: true });
        }
