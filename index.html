<!DOCTYPE html>
<html lang="id">
<head>
    <title>Peta Simulasi Gempabumi DIY</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 12px; border-radius: 10px;
            font-size: 13px; border: 2px solid #007bff; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); line-height: 1.6;
        }
        .btn-loc {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: #007bff; color: white; border: none;
            padding: 15px 30px; border-radius: 50px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box" id="info-panel">
        📡 GPS: Menunggu... <br>
        📏 Jarak ke Sesar: -
    </div>

    <button class="btn-loc" onclick="lacakSaya()">📍 Cek Posisi & Jarak Sesar</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-textpath@1.2.3/leaflet.textpath.min.js"></script>

    <script>
        var bounds = [[-7.242611, 109.761658], [-8.708642, 111.027832]];
        var map = L.map('map', { zoomControl: false }).fitBounds(bounds);

        L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 21, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        L.imageOverlay('pga.png', bounds, { opacity: 0.4 }).addTo(map);

        var dataSesar = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nama": "SESAR OPAK" }, "geometry": { "type": "LineString", "coordinates": [[110.276676,-8.024949],[110.299617,-8.004626],[110.316971,-7.991697],[110.334324,-7.978767],[110.345481,-7.969529],[110.359125,-7.95289],[110.382081,-7.916518],[110.398832,-7.888157],[110.413078,-7.880155],[110.435385,-7.859205],[110.45087,-7.848119],[110.480629,-7.80311],[110.509753,-7.766736],[110.555597,-7.710015]] } },
                { "type": "Feature", "properties": { "nama": "SESAR MATARAM" }, "geometry": { "type": "LineString", "coordinates": [[110.350487,-7.765148],[110.368555,-7.765104],[110.392415,-7.767349],[110.405762,-7.767571],[110.412648,-7.768762],[110.421356,-7.769334],[110.430376,-7.770893],[110.439063,-7.771963],[110.444513,-7.77261],[110.449209,-7.772299],[110.45387,-7.772138],[110.460198,-7.771941],[110.463554,-7.7724],[110.468199,-7.773036],[110.471948,-7.77355],[110.476744,-7.774266],[110.479259,-7.77466]] } },
                { "type": "Feature", "properties": { "nama": "SESAR MATARAM" }, "geometry": { "type": "LineString", "coordinates": [[110.509753,-7.766736],[110.520245,-7.76835],[110.526068,-7.768858],[110.533171,-7.770363],[110.546948,-7.773281],[110.553046,-7.774573],[110.557761,-7.775571],[110.5626,-7.777196],[110.569734,-7.779591],[110.577675,-7.782256],[110.582068,-7.784037],[110.588613,-7.78669],[110.597092,-7.789534],[110.60775,-7.791846],[110.617985,-7.793564],[110.624028,-7.794405],[110.62836,-7.795009],[110.644872,-7.79731]] } },
                { "type": "Feature", "properties": { "nama": "SESAR MERAPI MERBABU" }, "geometry": { "type": "LineString", "coordinates": [[110.464172,-7.574131],[110.463166,-7.561216],[110.462841,-7.548303],[110.461146,-7.542524],[110.459452,-7.535386],[110.456063,-7.522468],[110.453695,-7.509892],[110.452349,-7.497317],[110.449298,-7.486439],[110.44489,-7.472161],[110.441843,-7.458225],[110.439812,-7.449047],[110.435064,-7.434429],[110.431331,-7.425249],[110.428281,-7.414711],[110.421183,-7.375894],[110.422229,-7.356186],[110.427349,-7.345319],[110.429742,-7.337506],[110.436902,-7.32766]] } }
            ]
        };

        L.geoJSON(dataSesar, {
            style: function(feature) {
                var n = feature.properties.nama;
                var c = (n === "SESAR OPAK") ? "red" : (n === "SESAR MERAPI MERBABU" ? "red" : "red");
                return { color: c, weight: 6, opacity: 0.8 };
            },
            onEachFeature: function(feature, layer) {
                layer.setText(feature.properties.nama, { repeat: false, center: true, offset: -12, attributes: { 'fill': 'white', 'font-weight': 'bold', 'font-size': '14px', 'style': 'text-shadow: 2px 2px 3px black;' } });
            }
        }).addTo(map);

        // Objek GPS & Garis Penghubung
        var userMarker = L.circleMarker([0,0], { radius: 9, color: 'white', weight: 3, fillColor: '#007bff', fillOpacity: 1 }).addTo(map);
        var accuracyCircle = L.circle([0,0], { radius: 1, color: '#007bff', weight: 1, fillOpacity: 0.15 }).addTo(map);
        
        // GARIS JARAK: Garis biru putus-putus
        var distanceLine = L.polyline([], { color: '#007bff', weight: 3, dashArray: '5, 10', opacity: 0.8 }).addTo(map);

        var gpsActive = false;

        function lacakSaya() {
            if (!navigator.geolocation) return alert("GPS tidak didukung.");
            navigator.geolocation.watchPosition((pos) => {
                var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
                
                userMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]).setRadius(acc);

                // LOGIKA TURF UNTUK MENCARI TITIK TERDEKAT
                var userPt = turf.point([lng, lat]);
                var snapped = turf.nearestPointOnLine(dataSesar, userPt, { units: 'kilometers' });
                
                var closestLng = snapped.geometry.coordinates[0];
                var closestLat = snapped.geometry.coordinates[1];
                var jarak = snapped.properties.dist.toFixed(2);
                var namaSesar = snapped.properties.nama || "Sesar";

                // UPDATE GARIS PENGHUBUNG
                distanceLine.setLatLngs([
                    [lat, lng],           // Titik GPS User
                    [closestLat, closestLng] // Titik terdekat di sesar
                ]);

                document.getElementById('info-panel').innerHTML = `📡 GPS: ${Math.round(acc)} m <br> 📏 Jarak: <span style="color:red">${jarak} km ke ${namaSesar}</span>`;
                
                if (!gpsActive) { map.setView([lat, lng], 14); gpsActive = true; }
            }, (err) => alert("Aktifkan GPS!"), { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
